server:
  port: 8080

spring:
  application:
    name: gateway
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://login.microsoftonline.com/${AZURE_TENANT_ID:common}/v2.0
          jwk-set-uri: https://login.microsoftonline.com/${AZURE_TENANT_ID:common}/discovery/v2.0/keys
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth-service-v1
              uri: http://auth:8080
              predicates:
                - Path=/api/v1/auth/**
              filters:
                - RewritePath=/api/v1(?<segment>/?.*), $\{segment}

            - id: bff-service
              uri: http://bff:8080
              predicates:
                - Path=/api/v1/**

          globalcors:
            cors-configurations:
              "[/**]":
                allowedOrigins:
                  - "*"
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - PATCH
                allowedHeaders:
                  - "*"
                allowCredentials: false