spring.application.name=donation-service

spring.security.oauth2.resourceserver.jwt.issuer-uri=https://login.microsoftonline.com/${AZURE_TENANT_ID:common}/v2.0
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=https://login.microsoftonline.com/${AZURE_TENANT_ID:common}/discovery/v2.0/keys
azure.ad.audience=${AZURE_CLIENT_ID:test-client-id}

server.port=8080

spring.datasource.url=jdbc:postgresql://localhost:5432/donaton_donation
spring.datasource.username=postgres
spring.datasource.password=postgres

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

needs.base-url=http://needs:8080
logistics.base-url=http://logistics:8080